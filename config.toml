[plugin]
enabled = true
config_version = "1.4.1"

[date]
timezone = "Asia/Shanghai"
datetime_format = "%Y年%m月%d日"   # 仅控制 API/Tool 返回的日期格式；Hook 注入不含公历日期
include_lunar = true
include_traditional_festivals = true
include_statutory_holidays = true
include_solar_terms = true
include_western_festivals = true
inject_on_model_request = false
template = "【当前日期】现在是 {datetime} {weekday}{lunar}。{festivals}回复时如涉及日期、节日等请以此为准。"
# template 仅控制 API/Tool 的文本格式；Hook 注入使用固定轻型格式（不含公历/农历日期）
